# This file is included inside Elastic Beanstalk's Nginx server block.
# Laravel must be served from public/ rather than the application root.
root /var/app/current/public;
index index.php index.html;

location / {
    try_files $uri $uri/ /index.php?$query_string;
}

# Never expose environment or other dotfiles from the deployment bundle.
location ~ /\.(?!well-known).* {
    deny all;
}
