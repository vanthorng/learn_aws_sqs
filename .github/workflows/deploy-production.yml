
name: Deploy production

on:
  workflow_run:
    workflows: [CI]
    branches: [production]
    types: [completed]

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-deployment
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  deploy:
    name: Deploy Elastic Beanstalk

    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'production' &&
      github.event.workflow_run.head_repository.full_name == github.repository

    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production

    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      EB_APPLICATION_NAME: ${{ vars.EB_APPLICATION_NAME }}
      EB_ENVIRONMENT_NAME: ${{ vars.EB_ENVIRONMENT_NAME }}
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
      VITE_PUSHER_APP_KEY: ${{ secrets.VITE_PUSHER_APP_KEY }}
      VITE_PUSHER_APP_CLUSTER: ${{ secrets.VITE_PUSHER_APP_CLUSTER }}

    steps:

      # ========================================
      # 1. Checkout verified production commit
      # ========================================
      - name: Checkout production code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      # ========================================
      # 2. Validate configuration
      # ========================================
      - name: Validate deployment configuration
        run: |
          required=(
            AWS_REGION
            AWS_ROLE_ARN
            EB_APPLICATION_NAME
            EB_ENVIRONMENT_NAME
          )

          for name in "${required[@]}"; do
            if [[ -z "${!name}" ]]; then
              echo "Missing variable: ${name}"
              exit 1
            fi
          done

          echo "Deployment configuration validated"

      # ========================================
      # 3. Setup PHP
      # ========================================
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      # ========================================
      # 4. Setup Node.js
      # ========================================
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      # ========================================
      # 5. Install production dependencies
      # ========================================
      - name: Install Composer dependencies
        run: |
          composer install \
            --no-dev \
            --optimize-autoloader \
            --no-interaction \
            --no-progress

      # ========================================
      # 6. Build frontend assets
      # ========================================
      - name: Build Vite assets
        run: |
          npm ci
          npm run build

      # ========================================
      # 7. Create deployment ZIP
      # ========================================
      - name: Create Elastic Beanstalk bundle
        id: bundle
        run: |
          version_label="github-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${DEPLOY_SHA::7}"
          bundle_key="${EB_APPLICATION_NAME}/${version_label}.zip"

          zip -qr deployment.zip . \
            -x '.git/*' \
            -x '.github/*' \
            -x '.env' \
            -x '.env.*' \
            -x 'node_modules/*' \
            -x 'tests/*' \
            -x 'storage/logs/*' \
            -x 'storage/framework/cache/*' \
            -x 'storage/framework/sessions/*' \
            -x 'storage/framework/views/*' \
            -x 'bootstrap/cache/*.php' \
            -x 'deployment.zip'

          echo "version_label=${version_label}" >> "$GITHUB_OUTPUT"
          echo "bundle_key=${bundle_key}" >> "$GITHUB_OUTPUT"

          echo "Deployment package created"


      - name: Check GitHub OIDC subject
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');
            const payload = JSON.parse(
              Buffer.from(token.split('.')[1], 'base64url')
                .toString('utf8')
            );

            core.info(`OIDC Subject: ${payload.sub}`);
            core.info(`OIDC Audience: ${payload.aud}`);
            core.info(`Repository: ${payload.repository}`);
            core.info(`Repository ID: ${payload.repository_id}`);
            core.info(`Owner ID: ${payload.repository_owner_id}`);

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: github-actions-eb-deploy
          retry-max-attempts: 1

      # ========================================
      # 10. Verify AWS identity
      # ========================================
      - name: Verify AWS credentials
        run: |
          echo "Checking AWS identity..."
          aws sts get-caller-identity

      # ========================================
      # 11. Resolve Elastic Beanstalk S3 bucket
      # ========================================
      - name: Resolve Elastic Beanstalk storage
        id: storage
        run: |
          bucket=$(aws elasticbeanstalk create-storage-location \
            --query 'S3Bucket' \
            --output text)

          if [[ -z "$bucket" || "$bucket" == "None" ]]; then
            echo "Failed to resolve EB S3 bucket"
            exit 1
          fi

          echo "bucket=${bucket}" >> "$GITHUB_OUTPUT"

      # ========================================
      # 12. Upload deployment bundle to S3
      # ========================================
      - name: Upload deployment bundle
        env:
          S3_BUCKET: ${{ steps.storage.outputs.bucket }}
          BUNDLE_KEY: ${{ steps.bundle.outputs.bundle_key }}
        run: |
          aws s3 cp deployment.zip \
            "s3://${S3_BUCKET}/${BUNDLE_KEY}"

          echo "Bundle uploaded successfully"

      # ========================================
      # 13. Create application version
      # ========================================
      - name: Create Elastic Beanstalk application version
        env:
          S3_BUCKET: ${{ steps.storage.outputs.bucket }}
          BUNDLE_KEY: ${{ steps.bundle.outputs.bundle_key }}
          VERSION_LABEL: ${{ steps.bundle.outputs.version_label }}
        run: |
          aws elasticbeanstalk create-application-version \
            --application-name "$EB_APPLICATION_NAME" \
            --version-label "$VERSION_LABEL" \
            --description "GitHub deployment ${DEPLOY_SHA}" \
            --source-bundle \
              "S3Bucket=${S3_BUCKET},S3Key=${BUNDLE_KEY}"

      # ========================================
      # 14. Deploy application
      # ========================================
      - name: Deploy to Elastic Beanstalk
        env:
          VERSION_LABEL: ${{ steps.bundle.outputs.version_label }}
        run: |
          aws elasticbeanstalk update-environment \
            --application-name "$EB_APPLICATION_NAME" \
            --environment-name "$EB_ENVIRONMENT_NAME" \
            --version-label "$VERSION_LABEL"

      # ========================================
      # 15. Wait for deployment
      # ========================================
      - name: Wait for Elastic Beanstalk deployment
        run: |
          aws elasticbeanstalk wait environment-updated \
            --application-name "$EB_APPLICATION_NAME" \
            --environment-names "$EB_ENVIRONMENT_NAME"

      # ========================================
      # 16. Verify deployed application
      # ========================================
      - name: Verify deployment
        env:
          VERSION_LABEL: ${{ steps.bundle.outputs.version_label }}
        run: |
          read -r status health deployed_version <<< "$(
            aws elasticbeanstalk describe-environments \
              --application-name "$EB_APPLICATION_NAME" \
              --environment-names "$EB_ENVIRONMENT_NAME" \
              --query 'Environments[0].[Status,Health,VersionLabel]' \
              --output text
          )"

          echo "Status: $status"
          echo "Health: $health"
          echo "Deployed Version: $deployed_version"
          echo "Expected Version: $VERSION_LABEL"

          if [[ "$status" != "Ready" ]]; then
            echo "Environment is not ready"
            exit 1
          fi

          if [[ "$deployed_version" != "$VERSION_LABEL" ]]; then
            echo "Version mismatch"
            exit 1
          fi

          if [[ "$health" == "Red" ]]; then
            echo "Environment health is Red"
            exit 1
          fi

          echo "Deployment completed successfully"

      # ========================================
      # 17. Show logs on deployment failure 
      # ========================================
      - name: Show Elastic Beanstalk events on failure
        if: failure() && steps.aws_auth.outcome == 'success'
        run: |
          aws elasticbeanstalk describe-events \
            --environment-name "$EB_ENVIRONMENT_NAME" \
            --max-items 15 \
            --query 'Events[*].[EventDate,Severity,Message]' \
            --output table || true
